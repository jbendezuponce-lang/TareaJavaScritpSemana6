@if (open()) {
  <div class="modal d-block" tabindex="-1" role="dialog" aria-modal="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">{{ title() }}</h5>
          <button type="button" class="btn-close" aria-label="Cerrar" (click)="cancelled.emit()"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">{{ message() }}</p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" (click)="cancelled.emit()" [disabled]="busy()">
            Cancelar
          </button>
          <button type="button" class="btn btn-danger" (click)="confirmed.emit()" [disabled]="busy()">
            @if (busy()) {
              <span class="spinner-border spinner-border-sm me-1"></span>
            }
            {{ confirmText() }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop show"></div>
}
