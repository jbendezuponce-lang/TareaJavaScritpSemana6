<div class="toast-container position-fixed top-0 end-0 p-3">
  @for (n of notifications.items(); track n.id) {
    <div class="toast show align-items-center border-0 text-bg-{{ n.type }}" role="alert">
      <div class="d-flex">
        <div class="toast-body">
          <i class="bi me-2" [class.bi-check-circle-fill]="n.type === 'success'"
             [class.bi-exclamation-triangle-fill]="n.type === 'danger'"></i>
          {{ n.text }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                aria-label="Cerrar" (click)="notifications.dismiss(n.id)"></button>
      </div>
    </div>
  }
</div>
